name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Push APK to website repo
        env:
          GH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/Dropoutweb-main.git site
          mkdir -p site/download
          cp android/app/build/outputs/apk/debug/app-debug.apk site/download/dropout-traders.apk
          cd site
          git config user.name "dropout-app-bot"
          git config user.email "bot@dropouttraders.in"
          git add download/dropout-traders.apk
          git commit -m "Update Android app build" || echo "No changes"
          git push
